name: Build Tauri App

on:
  push:
    branches: [main]
    paths:
      - 'MuToolsCode/**'
  pull_request:
    paths:
      - 'MuToolsCode/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: MuToolsCode

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: MuToolsCode/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: MuToolsCode/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: mutools-windows-installers
          if-no-files-found: warn
          path: |
            MuToolsCode/src-tauri/target/release/bundle/nsis/*.exe
            MuToolsCode/src-tauri/target/release/bundle/msi/*.msi
